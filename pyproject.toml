[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatgpt-vs-claude"
version = "0.1.0"
description = "Let a logged-in ChatGPT and the local Claude Code debate each other automatically, using an isolated browser profile"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "takano32" }]
dependencies = [
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
chatgpt-vs-claude = "chatgpt_vs_claude.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatgpt_vs_claude"]
